# camera_config.yaml
# 摄像头配置文件示例

cameras:
  # 前向摄像头
  camera_0:
    type: usb
    device_id: 2
    width: 640
    height: 640
    fps: 20.0
    resize: [640, 640]
    enhance: false
    blur: false
    
  # 夹爪视角摄像头
  camera_1:
    type: usb
    device_id: 5
    width: 640
    height: 640
    fps: 20.0
    resize: [640, 640]
    enhance: false
    blur: false

# 全局设置
global:
  publish_rate: 20.0    # 发布频率
  image_quality: 80     # JPEG压缩质量
  auto_exposure: true   # 自动曝光
